<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#193f45">
<title>景點閱讀卡｜絲路研學誌</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f2e9;color:#223639;font:17px/1.65 system-ui,sans-serif}
main{max-width:680px;margin:auto;padding:16px 16px 48px}
a{color:#205851}
.back{display:inline-block;padding:8px 0 14px;font-weight:650;text-decoration:none}
header{background:#193f45;color:#fff9ed;border-radius:18px;padding:24px}
header small,.label{font-size:13px;letter-spacing:.1em;font-weight:700}
h1{font:700 34px/1.3 ui-serif,"Songti TC",serif;margin:8px 0}
header p{margin:4px 0}
.filters{display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.filters button{font:inherit;border:1px solid #9dada6;border-radius:20px;
background:#fffdf8;color:#23454a;padding:7px 18px;cursor:pointer}
.filters button[aria-pressed="true"]{background:#193f45;color:white;border-color:#193f45}
#count{display:block;color:#536565;margin:8px 2px 12px}
details{background:#fffdf8;border:1px solid #d8d2c5;border-radius:14px;
margin:0 0 10px;overflow:hidden}
details[open]{border-color:#ac7654}
summary{cursor:pointer;padding:15px 16px;list-style:none;display:flex;
align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:#895038;font-size:22px}
details[open]>summary::after{content:"−"}
.num{background:#f1e5d6;color:#784229;min-width:42px;height:42px;
display:grid;place-items:center;border-radius:12px;font-weight:700}
.meta{display:block;font-size:13px;color:#586864}
.name{font-size:18px;display:block}
.inside{padding:0 18px 18px}
.inside p{margin:0 0 12px}
.clue{padding:12px 14px;border-left:3px solid #bf8455;background:#f5eee2}
.label{display:block;color:#80472b}
.source{display:inline-block;padding:9px 13px;background:#e4eeea;border-radius:9px;
text-decoration:none;font-weight:650}
footer{font-size:13px;color:#536565;margin:20px 2px}
</style>
</head>
<body>
<main>
<a class="back" href="./index.html">← 返回絲路研學誌</a>
<header>
  <small>絲路研學誌　／　隨身導覽</small>
  <h1>景點閱讀卡</h1>
  <p>到站之前，先讀一張卡。到了現場，找一個只有親眼看見才會留意的細節。</p>
</header>
<nav class="filters" aria-label="按城市篩選">
  <button type="button" data-city="全部" aria-pressed="true">全部</button>
  <button type="button" data-city="西安" aria-pressed="false">西安</button>
  <button type="button" data-city="敦煌" aria-pressed="false">敦煌</button>
</nav>
<small id="count" role="status"></small>
<section id="list" aria-label="景點卡片"></section>
<footer>點景點名稱可展開或收起。標有 ↗ 的資料會另開外部網頁，需要網絡；返回原來的分頁即可繼續閱讀。</footer>
</main>

<script>
const dunhuangGuide="https://www.gswbj.gov.cn/a/2024/09/10/22009.html";
const xianGuide="https://www.xa.gov.cn/ztzl/ztzl/lzledc/ywdc/64e6beb4f8fd1c1a703777a9.html";

const cards=[
["12/18","西安","西安鼓樓","城市與時間",
 "今天，我們看手機就知道時間。從前，鼓聲卻可以是城市生活的時間訊號。站在鼓樓下，不妨先不看鐘錶，想像同一陣鼓聲傳到不同街巷時，人們會怎樣回應。",
 "退後幾步，看一看樓的位置和高度。假如要把訊息傳給街上的人，這個位置有甚麼好處？",
 "西安市政府｜認識西安鐘鼓樓與古城",xianGuide],

["12/18","西安","大唐不夜城","唐風與當代演出",
 "這裏是以盛唐文化為主題的現代步行街。唐詩、服飾、雕塑和舞台演出，都是今天的人用來講述長安故事的方式。它和真正留存至今的古蹟，是兩種不同的歷史體驗。",
 "選一個最有「唐風」的畫面。如果拿走燈光和音樂，你仍會聯想到唐代嗎？",
 "曲江新區｜認識大唐不夜城街區",
 "https://qjxq.xa.gov.cn/zsyz/tzhj/1946143355385155585.html"],

["12/19","西安","秦始皇帝陵博物院","從一尊陶俑看整個軍陣",
 "兵馬俑坑是秦始皇帝陵的陪葬坑，不是皇帝的墓室。站在坑前，可以把視線拉遠看整體隊列，再拉近看一尊俑：同一個軍陣，其實可以從兩種很不同的尺度閱讀。",
 "先不說「很壯觀」。如果只能用三個可見細節描述眼前的一尊俑，你會選哪三個？",
 "秦始皇帝陵博物院｜陵園與兵馬俑坑",
 "https://www.bmy.com.cn/about/"],

["12/20","敦煌","陽關遺址及博物館","從詩句走進邊關",
 "不少人先從王維的送別詩認識陽關。來到現場，除了讀詩，還可以辨認兩類線索：古代留下的遺跡，以及現代博物館為幫助觀眾理解歷史而設的展示。",
 "找一塊展板：它用甚麼字眼告訴你，眼前的是遺址、復原場景，還是出土文物？",
 "甘肅文旅｜閱讀「陽關博物館」介紹",dunhuangGuide],

["12/20","敦煌","玉門關遺址","旅人為何要經過關口？",
 "玉門關是漢代通往西域的重要交通節點。把它想成旅人的一站，而不只是一座孤立建築：向前是甚麼地形？甚麼人、貨物和消息可能從這裏經過？",
 "轉身看看遺址四周。你會用哪一個方向的景象，向香港的同學解釋「邊關」？",
 "甘肅文旅｜閱讀「玉門關故址」介紹",dunhuangGuide],

["12/20","敦煌","敦煌雅丹國家地質公園","這是一座城嗎？",
 "有些雅丹像城牆，有些像塔樓，但它們不是人造建築。這些地貌是地表沉積物經侵蝕而成；在敦煌雅丹的形成過程中，風和水都參與了塑形。",
 "先替一處地貌改個形象化的名字，再不用比喻，只描述它的輪廓、層次和表面。",
 "甘肅文旅｜閱讀「雅丹地質公園」介紹",dunhuangGuide],

["12/21","敦煌","鳴沙山月牙泉","沙與水的邊界",
 "這裏的主角不是一座山或一泓泉，而是兩者竟能在同一幅景象中出現。觀察時可把視線從沙脊慢慢移到泉邊，留意線條、顏色和植被由哪裏開始改變。",
 "用手指在空中描一次沙脊，再描一次水邊。哪一條線條較容易看清？",
 "甘肅文旅｜閱讀「鳴沙山－月牙泉」介紹",dunhuangGuide],

["12/21","敦煌","莫高窟","一面牆，怎樣講一個故事？",
 "洞窟的牆壁不只是裝飾，也可以用畫面講故事。一次參觀不必記住所有內容：只追蹤一個人物、一個動作或一段衣帶，已經是一種細讀。出發前可先到「數字敦煌」的資源庫練習觀看。",
 "在網上看一幅壁畫，找出第一個吸引你視線的細節。到現場請遵從導賞安排，離開洞窟後才用手機記錄。",
 "敦煌研究院｜進入數字敦煌",
 "https://www.e-dunhuang.com/"],

["12/21","敦煌","敦煌石窟文物保護研究陳列中心","為甚麼要看複製窟？",
 "複製窟不是讓你「再看一次」那麼簡單。它讓觀眾有另一種觀看條件：可以比較畫面的位置、回看剛才錯過的細節，也可以思考研究人員怎樣記錄和展示原窟。",
 "選一個你在複製展示中看清楚的細節。它幫你回答了剛才在洞窟裏的哪個疑問？",
 "敦煌研究院｜陳列中心展覽介紹",
 "https://dunhuangcaves.org/jggk/jgsz/ywbm/ysyjb1/dhskwwbhyjclzx.htm"],

["12/21","敦煌","沙洲夜市","在當代生活裏找敦煌",
 "今天的考察從石窟走到市集。這一站不必尋找最古老的東西，反而可以看看人們今天怎樣使用「敦煌」這個名字：招牌、商品和圖案，各自選了甚麼來代表這座城市？",
 "找兩件用了相似圖案的東西。它們是在講同一個故事，還是只是用了相同的裝飾？",
 "延伸比較｜數字敦煌的藝術素材",
 "https://ip.e-dunhuang.com/"],

["12/22","敦煌","敦煌市博物館","一張展品標籤怎樣讀？",
 "在地方博物館，可以從一件東西認識一座城。先讀名稱，再找年代、用途或出土地點。標籤寫得很短，反而適合練習分辨：哪些是館方提供的資料，哪些是你根據外形作出的猜想？",
 "挑一件展品，說一句「標籤告訴我……」，再說一句「我還想知道……」。這兩句就是你的導賞起點。",
 "延伸閱讀｜敦煌的博物館與文化展示",
 "https://www.gswbj.gov.cn/a/2024/10/23/22904.html"],

["12/23","西安","大唐芙蓉園","用園林講述盛唐",
 "大唐芙蓉園是仿照唐代皇家園林風格建造的現代文化園區。和博物館不同，這裏透過樓閣、園路和水景安排你的觀看次序：轉一個彎，眼前的主角便可能改變。",
 "選一處轉角，分別記住轉彎前後第一眼看到的景物。假如你是園林設計者，為甚麼要這樣安排？",
 "西安市政府｜大唐芙蓉園的設計背景",xianGuide]
];

const list=document.getElementById("list");
function make(tag,text,cls){
  const node=document.createElement(tag);
  node.textContent=text;
  if(cls) node.className=cls;
  return node;
}
function show(city){
  list.replaceChildren();
  let total=0;
  cards.forEach((c,i)=>{
    if(city!=="全部" && c[1]!==city) return;
    total++;
    const box=document.createElement("details");
    const head=document.createElement("summary");
    head.append(make("span",String(i+1).padStart(2,"0"),"num"));
    const words=document.createElement("span");
    words.append(make("span",c[0]+" · "+c[1],"meta"),make("strong",c[2],"name"));
    head.append(words);
    const body=document.createElement("div");
    body.className="inside";
    body.append(make("p",c[3],"label"),make("p",c[4]));
    const tip=make("div","","clue");
    tip.append(make("b","現場留意","label"),document.createTextNode(c[5]));
    const p=document.createElement("p");
    p.style.marginTop="14px";
    const link=make("a",c[6]+" ↗","source");
    link.href=c[7]; link.target="_blank"; link.rel="noopener noreferrer";
    p.append(link);body.append(tip,p);
    box.append(head,body);list.append(box);
  });
  document.getElementById("count").textContent=
    (city==="全部"?"兩個城市":city)+" · "+total+" 張閱讀卡";
  document.querySelectorAll("[data-city]").forEach(b=>
    b.setAttribute("aria-pressed",String(b.dataset.city===city)));
}
document.querySelectorAll("[data-city]").forEach(b=>
  b.addEventListener("click",()=>show(b.dataset.city)));
show("全部");
</script>
</body>
</html>
